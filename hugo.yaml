#=======================================#
# Taxonomies and blog URLs
#=======================================#
taxonomies:
  categories: categories
  tags: tags
  author: authors

permalinks:
  blog: '/:sections/:contentbasename/'

#=======================================#
# Markdown and syntax highlighting
#=======================================#
markup:
  goldmark:
    parser:
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
      autoHeadingID: true
      autoHeadingIDType: github
    renderer:
      unsafe: true
    extensions:
      footnote: true
      linkify: true
      table: true
      taskList: true
      typographer: true
      passthrough:
        enable: true
        delimiters:
          inline:
            - ['\(', '\)']
          block:
            - ['$$', '$$']
            - ['\[', '\]']
  highlight:
    style: tango
    codeFences: true
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 4

#=======================================#
# Outputs
#=======================================#
outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

#=======================================#
# Site parameters
#=======================================#
params:
  description: "pg_mooncake adds real-time columnstore mirror tables and Apache Iceberg v2 lakehouse storage to PostgreSQL, powered by Moonlink and DuckDB, maintained by the Pigsty community."
  logo: img/mooncake.svg
  version: 0.3.0
  copyright:
    authors: '[Mooncake Labs](https://github.com/Mooncake-Labs) & [PGSTY](https://pigsty.io/) · [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)'
    from_year: 2024
    url: https://pigsty.io/

  page_width: normal
  time_format_blog: 2006-01-02
  time_format_default: 2006-01-02
  footer_icp: ""

  # Upstream provenance defaults
  upstream_name: Mooncake-Labs/pg_mooncake
  upstream_license: MIT
  upstream_notice: /docs/about/attribution/

  archived_version: false
  url_latest_version: https://mooncake.pgsty.com
  github_repo: https://github.com/pgsty/mooncake.pgsty.com
  github_project_repo: https://github.com/pgsty/pg_mooncake
  github_branch: main

  offline_search: true
  offline_search_index: content
  offline_search_summary_length: 90
  offline_search_max_results: 10
  highlight_classes: true

  comments:
    enable: false

  ui:
    compare: true
    preset: paper
    preset_menu: [paper, slate, ink, terminal]
    shell_types: [docs, blog]
    quick_links: [docs, blog]
    sidebar_icon_policy: all
    typography: technical
    breadcrumb: true
    navbar_logo: true
    navbar_translucent_over_cover_disable: false
    navbar_theme: dark
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_menu_truncate: 2000
    sidebar_cache_limit: 1000
    sidebar_root_enabled: true
    sidebar_expand_levels: 2
    dark_mode: true
    scroll_spy: false
    sidebar_root_menu: true
    sidebar_width_min: 220
    sidebar_width_max: 480
    sidebar_item_overflow: ellipsis
    page_context_menu:
      enable: true
      assistant_links: false
      links: []
    feedback:
      enable: false
    reading_time: false
    section_index: cards
    blog_index: cards
    blog_index_columns: 3
    blog_index_toggle: true
    blog_index_size: 18
    backlinks: true

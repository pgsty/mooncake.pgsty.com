#=======================================#
# Basics
#=======================================#
baseURL: https://mooncake.pgsty.com/
title: Mooncake - Real-Time Columnstore & Apache Iceberg Lakehouse for PostgreSQL
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
enableGitInfo: true
hasCJKLanguage: true
capitalizeListTitles: false
timeZone: UTC

pagination:
  pagerSize: 20

services:
  googleAnalytics:
    id: G-JLB25NYKJX

frontmatter:
  lastmod:
    - lastmod
    - ":git"
    - date
    - publishDate

#=======================================#
# Hugo Module
#=======================================#
module:
  proxy: direct
  hugoVersion:
    extended: true
    min: "0.168.0"
  imports:
    - path: github.com/pgsty/oink

#=======================================#
# Languages and navigation
#=======================================#
languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: Mooncake
    params:
      description: "Real-time columnstore mirror and Apache Iceberg v2 lakehouse tables for PostgreSQL — powered by pg_mooncake, Moonlink, and DuckDB, maintained by PGSTY."
      upstream_copyright: "© 2024–2026 Mooncake Labs Inc."
      ui:
        command_palette:
          commands:
            - id: quick_start
              title: Getting Started & Installation
              description: Install pg_mooncake with Pigsty packages or build from source on PostgreSQL 14–18
              url: /docs/getting-started/
              icon: fa-solid fa-bolt
              keywords: [start, quickstart, install, pig, pg_mooncake, pg_duckdb]
            - id: hello_world
              title: Hello World Tutorial
              description: Create a real-time columnstore mirror with mooncake.create_table and run DuckDB analytics
              url: /docs/getting-started/hello-world/
              icon: fa-solid fa-terminal
              keywords: [hello, tutorial, create_table, mirror, columnstore]
            - id: architecture
              title: Architecture Overview
              description: How pg_mooncake, Moonlink, pg_duckdb, and duckdb_mooncake work together
              url: /docs/intro/architecture/
              icon: fa-solid fa-sitemap
              keywords: [architecture, moonlink, duckdb, iceberg, parquet, wal]
            - id: moonlink_docs
              title: Moonlink Ingestion Engine
              description: Real-time logical replication, Arrow write buffers, deletion vectors, and standalone HTTP/RPC server
              url: /docs/intro/moonlink/
              icon: fa-solid fa-arrows-rotate
              keywords: [moonlink, cdc, replication, arrow, parquet, iceberg]
            - id: duckdb_mooncake_docs
              title: duckdb_mooncake & DuckDB 2.0
              description: DuckDB storage extension attaching to Moonlink metadata and scanning Parquet/Iceberg
              url: /docs/intro/duckdb-mooncake/
              icon: fa-solid fa-database
              keywords: [duckdb, duckdb_mooncake, pg_duckdb, parquet, scan]
            - id: sql_reference
              title: SQL & Configuration Reference
              description: mooncake.create_table, create_snapshot, optimize_table, list_tables, and GUC settings
              url: /docs/reference/
              icon: fa-solid fa-code
              keywords: [reference, sql, guc, create_table, create_snapshot, list_tables]
            - id: iceberg_reference
              title: Iceberg & Object Storage
              description: Configure S3 / R2 buckets, trigger Iceberg snapshots, and query from Spark, Snowflake, or DuckDB
              url: /docs/reference/iceberg/
              icon: fa-solid fa-cloud
              keywords: [iceberg, s3, r2, bucket, snapshot, warehouse]
            - id: use_cases
              title: Use Cases (HTAP, Archiving, Lakehouse, Logs)
              description: Real-time operational analytics, partition archiving, zero-ETL lakehouse, and OTel logs
              url: /docs/use-cases/
              icon: fa-solid fa-diagram-project
              keywords: [use-cases, htap, analytics, archiving, lakehouse, logging]
            - id: v01_archive
              title: v0.1 Historical Documentation (Delta Lake)
              description: Legacy documentation archive for pg_mooncake v0.1 (USING columnstore + Delta Lake)
              url: /docs/v0.1/
              icon: fa-solid fa-box-archive
              keywords: [v0.1, legacy, delta, columnstore, archive]
            - id: download_packages
              title: Download & Availability Matrix
              description: Install pg_mooncake with pig or native RPM/DEB packages across 16 Linux targets
              url: /download/
              icon: fa-solid fa-download
              keywords: [download, install, pig, rpm, deb, matrix, packages]
    menu:
      main:
        - identifier: docs
          name: Docs
          pageRef: /docs
          weight: 10
          params:
            icon: fa-solid fa-book
        - identifier: docs-intro
          parent: docs
          name: Introduction & Architecture
          pageRef: /docs/intro
          weight: 10
          params:
            icon: fa-solid fa-compass
            description: Overview of pg_mooncake, Moonlink, duckdb_mooncake, and v0.1 vs v0.2/v0.3
        - identifier: docs-getting-started
          parent: docs
          name: Getting Started
          pageRef: /docs/getting-started
          weight: 20
          params:
            icon: fa-solid fa-rocket
            description: Installation with Pigsty or source, Hello World tutorial, and known limitations
        - identifier: docs-reference
          parent: docs
          name: SQL & Config Reference
          pageRef: /docs/reference
          weight: 30
          params:
            icon: fa-solid fa-code
            description: Columnstore procedures, query shapes, Iceberg snapshots, and data lake scans
        - identifier: docs-use-cases
          parent: docs
          name: Use Cases
          pageRef: /docs/use-cases
          weight: 40
          params:
            icon: fa-solid fa-diagram-project
            description: Real-time HTAP analytics, partition archiving, Postgres lakehouse, and logs
        - identifier: docs-v01
          parent: docs
          name: v0.1 Archive (Delta Lake)
          pageRef: /docs/v0.1
          weight: 50
          params:
            icon: fa-solid fa-box-archive
            description: Complete historical documentation for pg_mooncake v0.1 (USING columnstore)
        - identifier: docs-about
          parent: docs
          name: About & Licensing
          pageRef: /docs/about
          weight: 60
          params:
            icon: fa-solid fa-circle-info
            description: PGSTY stewardship, MIT & BSL-1.1 exception licensing, attribution, and SBOM
        - identifier: blog
          name: Blog
          pageRef: /blog
          weight: 20
          params:
            icon: fa-solid fa-blog
        - identifier: blog-post
          parent: blog
          name: Engineering & Deep Dives
          pageRef: /blog/post
          weight: 10
          params:
            icon: fa-solid fa-compass-drafting
            description: DuckDB 2.0 adaptation, Moonlink LSN barriers, and Rust dependency audits
        - identifier: blog-release
          parent: blog
          name: Release Notes
          pageRef: /blog/release
          weight: 20
          params:
            icon: fa-solid fa-tag
            description: Version announcements for pg_mooncake, duckdb_mooncake, and moonlink
        - identifier: download
          name: Download
          pageRef: /download
          weight: 30
          params:
            icon: fa-solid fa-download
        - identifier: pigsty
          name: Pigsty
          weight: 60
          url: https://pigsty.io
          params:
            icon: fa-solid fa-database
        - identifier: github
          name: GitHub
          weight: 70
          url: https://github.com/pgsty/pg_mooncake
          params:
            icon: fa-brands fa-github

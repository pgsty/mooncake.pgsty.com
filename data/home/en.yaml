hero:
  eyebrow: pg_mooncake 0.3.0 · PostgreSQL 14–18 · DuckDB 2.0 & Apache Iceberg v2
  title_lines:
    - Real-Time Columnstore
    - Built for PostgreSQL
  title_size: 3.6rem
  lead: >-
    Create sub-second columnar mirrors of PostgreSQL tables powered by
    `moonlink` logical replication, `pg_duckdb` vectorized execution, and open Apache Iceberg v2 storage.
  note: 'Forked from [Mooncake Labs](https://github.com/Mooncake-Labs/pg_mooncake), now maintained by [PGSTY](https://pgsty.com/) · [MIT & BSL-1.1 Exception](/docs/about/license/)'
  image:
    light: img/mooncake-architecture-light.svg
    dark: img/mooncake-architecture-dark.svg
    alt: >-
      Mooncake architecture: PostgreSQL rowstore WAL streams into Moonlink in-memory Arrow buffers
      and Parquet files, queried via pg_duckdb and duckdb_mooncake or exported as Apache Iceberg v2 tables.
  media:
    ratio: 1.24fr 0.76fr
    max_width: 440px
    hide_below: lg
  actions:
    - label: Get Started
      url: /docs/getting-started/
      icon: fa-solid fa-rocket
      style: primary
    - label: Hello World
      url: /docs/getting-started/hello-world/
      icon: fa-solid fa-terminal
      style: ghost
    - label: Architecture
      url: /docs/intro/architecture/
      icon: fa-solid fa-sitemap
      style: ghost
  detail:
    label: What's new in pg_mooncake 0.3.0
    url: /blog/release/pg-mooncake-0.3.0/

metrics:
  eyebrow: Real-Time HTAP & Lakehouse Performance
  title: Columnar analytics in Postgres without ETL pipelines
  desc: Combine PostgreSQL transactional writes with DuckDB 2.0 vectorized execution and open Apache Iceberg v2 object storage.
  columns: 2
  items:
    - value: "Up to 1000×"
      title: Faster analytical scans
      label: Faster analytical scans
      desc: Vectorized DuckDB 2.0 scans over Parquet & Arrow vs regular Postgres heap tables
      icon: fa-solid fa-bolt
      url: /docs/reference/query-columnstore/
    - value: "< 10 ms"
      title: Sub-second CDC sync
      label: Sub-second CDC sync
      desc: Logical replication streams INSERT, UPDATE, and DELETE changes directly into Moonlink buffers
      icon: fa-solid fa-arrows-rotate
      url: /docs/intro/moonlink/
    - value: "Iceberg v2"
      title: Open Lakehouse format
      label: Open Lakehouse format
      desc: Export snapshots to S3, Cloudflare R2, or local disk for Spark, Snowflake, and PyIceberg
      icon: fa-solid fa-cloud
      url: /docs/reference/iceberg/
    - value: "Zero ETL"
      title: No Kafka or Debezium
      label: No Kafka or Debezium
      desc: Mirror local or remote PostgreSQL tables with a single CALL mooncake.create_table()
      icon: fa-solid fa-layer-group
      url: /docs/reference/create-columnstore/

capabilities:
  eyebrow: Core Engine Architecture
  title: Write to rowstore, read from columnstore
  text: pg_mooncake pairs an embedded Rust ingestion engine (moonlink) with DuckDB 2.0 vectorized execution via pg_duckdb and duckdb_mooncake.
  items:
    - ref: 01 / PG_MOONCAKE · COLUMNSTORE MIRROR
      title: One command to mirror any Postgres table
      url: /docs/reference/create-columnstore/
      motto: Native USING mooncake Table Access Method + Logical Replication
      bullets:
        - 'Creates a read-only `USING mooncake` mirror of any heap or partitioned table'
        - 'Keeps your OLTP write path 100% unchanged—no triggers or dual writes'
        - 'Can replicate from the local database or a remote PostgreSQL `src_uri`'
      value: Turn slow analytical queries into sub-second vectorized scans.
      visual:
        type: code
        aria_label: Create a columnstore mirror table in PostgreSQL
        title: create_mirror.sql
        lines:
          - { class: c, prefix: '-- ', text: 'Enable pg_mooncake (auto-loads pg_duckdb 1.2.0)' }
          - { class: k, prefix: '', text: 'CREATE EXTENSION IF NOT EXISTS pg_mooncake CASCADE;' }
          - { class: c, prefix: '-- ', text: 'Create a real-time columnstore mirror of orders' }
          - { class: k, prefix: '', text: 'CALL mooncake.create_table(''orders_analytics'', ''orders'');' }
          - { class: c, prefix: '-- ', text: 'Write to rowstore, query from columnstore' }
          - { class: k, prefix: '', text: 'INSERT INTO orders (customer_id, amount) VALUES (42, 199.95);' }
          - { class: k, prefix: '', text: 'SELECT customer_id, SUM(amount) FROM orders_analytics' }
          - { class: k, prefix: '  ', text: 'GROUP BY customer_id;' }
    - ref: 02 / MOONLINK · REAL-TIME CDC ENGINE
      title: Fast updates, deletes, and LSN consistency
      url: /docs/intro/moonlink/
      motto: Embedded Rust background worker & standalone ingestion server
      bullets:
        - 'Buffers recent writes in memory as **Apache Arrow** record batches'
        - 'Handles `UPDATE` and `DELETE` via **Roaring Bitmap** deletion vectors'
        - 'Enforces PostgreSQL LSN barriers so queries always read consistent snapshots'
      value: Avoids the small-file problem of traditional Parquet/Iceberg writers.
      visual:
        type: code
        aria_label: Inspect Moonlink replication LSN and flush state
        title: moonlink_status.sql
        lines:
          - { class: c, prefix: '-- ', text: 'Inspect active columnstore mirrors and WAL LSNs' }
          - { class: k, prefix: '', text: 'SELECT * FROM mooncake.list_tables();' }
          - { class: c, prefix: '-- ', text: 'Returns: table, commit_lsn, flush_lsn, iceberg_warehouse_location' }
          - { class: c, prefix: '-- ', text: 'Force-flush buffered Arrow data into Parquet + Iceberg' }
          - { class: k, prefix: '', text: 'CALL mooncake.create_snapshot(''orders_analytics'');' }
          - { class: c, prefix: '-- ', text: 'Compact Parquet files and rewrite deletion vectors' }
          - { class: k, prefix: '', text: 'CALL mooncake.optimize_table(''orders_analytics'', ''full'');' }
    - ref: 03 / DUCKDB_MOONCAKE · VECTORIZED SCAN
      title: Powered by DuckDB 2.0 & pg_duckdb 1.2
      url: /docs/intro/duckdb-mooncake/
      motto: Multi-file Parquet statistics pruning + zero-copy Arrow scan
      bullets:
        - 'Merges flushed **Parquet** files and in-memory **Arrow** buffers on the fly'
        - 'Uses DuckDB 2.0 multi-file Parquet statistics for segment elimination'
        - 'Seamlessly joins columnstore tables with regular PostgreSQL heap tables'
      value: Full DuckDB analytical speed using standard PostgreSQL connections.
      visual:
        type: code
        aria_label: Hybrid join between Postgres heap and Mooncake columnstore
        title: hybrid_join.sql
        lines:
          - { class: c, prefix: '-- ', text: 'Join regular Postgres heap table with columnstore mirror' }
          - { class: k, prefix: '', text: 'SELECT u.region, date_trunc(''day'', o.created_at) AS day,' }
          - { class: k, prefix: '       ', text: 'COUNT(*) AS orders, SUM(o.amount) AS revenue' }
          - { class: k, prefix: '', text: 'FROM users u' }
          - { class: k, prefix: '', text: 'JOIN orders_analytics o ON u.id = o.customer_id' }
          - { class: k, prefix: '', text: 'WHERE o.created_at >= NOW() - INTERVAL ''30 days''' }
          - { class: k, prefix: '', text: 'GROUP BY u.region, day ORDER BY day DESC;' }
    - ref: 04 / APACHE ICEBERG v2 · ZERO-ETL LAKEHOUSE
      title: Export to S3 / R2 & query your data lake
      url: /docs/reference/iceberg/
      motto: Open Iceberg v2 metadata + external Parquet/Delta/Iceberg scans
      bullets:
        - 'Writes standard **Apache Iceberg v2** metadata to local disk, S3, or R2'
        - 'Query external Parquet, CSV, Iceberg, and Delta Lake files inside Postgres'
        - ' Partition-archiving pattern: drop old Postgres partitions, keep full history in S3'
      value: Bridge operational Postgres and your cloud lakehouse without external pipelines.
      visual:
        type: code
        aria_label: Configure S3 bucket and query Iceberg metadata
        title: iceberg_lakehouse.sql
        lines:
          - { class: c, prefix: '-- ', text: 'Configure S3 / R2 credentials and default bucket' }
          - { class: k, prefix: '', text: 'INSERT INTO duckdb.secrets (name, type, key_id, secret, region, scope)' }
          - { class: v, prefix: '  ', text: 'VALUES (''s3_lake'', ''S3'', ''AKIA...'', ''secret...'', ''us-east-1'', ''s3://my-bucket'');' }
          - { class: k, prefix: '', text: 'SET mooncake.default_bucket = ''s3://my-bucket/warehouse'';' }
          - { class: c, prefix: '-- ', text: 'Materialize a new Iceberg v2 snapshot on S3' }
          - { class: k, prefix: '', text: 'CALL mooncake.create_snapshot(''orders_analytics'');' }


steps:
  eyebrow: Quick Start
  title: Run pg_mooncake in three steps
  desc: Install native packages via Pigsty, preload the extensions, and create your first real-time columnstore mirror.
  items:
    - icon: fa-solid fa-download
      title: Install packages
      desc: Install `pg_duckdb` and `pg_mooncake` with the `pig` package manager across 16 Linux targets and PostgreSQL 14–18.
      cmd:
        code: pig repo add pgsql -u && pig install pg_duckdb pg_mooncake
    - icon: fa-solid fa-plug
      title: Enable extension
      desc: Set `wal_level = logical` and `shared_preload_libraries = 'pg_duckdb,pg_mooncake'`, then enable `pg_mooncake`.
      cmd:
        code: psql -d postgres -c "CREATE EXTENSION IF NOT EXISTS pg_mooncake CASCADE;"
    - icon: fa-solid fa-table-columns
      title: Mirror & query
      desc: Create a real-time columnstore mirror of your table with `mooncake.create_table` and run vectorized queries.
      cmd:
        code: psql -d postgres -c "CALL mooncake.create_table('orders_analytics', 'orders');"

faq:
  eyebrow: Frequently Asked Questions
  title: Understanding Mooncake & PGSTY Stewardship
  flat: true
  items:
    - question: Why is the PGSTY community maintaining pg_mooncake, duckdb_mooncake, and moonlink?
      answer: >-
        **Mooncake Labs Inc.**, the creators of `pg_mooncake`, `duckdb_mooncake`, and `moonlink`, was acquired by
        Databricks, after which the original documentation site (`docs.mooncake.dev`) went offline and upstream
        maintenance paused. The **[PGSTY](https://pigsty.io/)** community recovered the complete historical documentation
        from the Internet Archive Wayback Machine and maintains the open-source forks—[`pgsty/pg_mooncake`](https://github.com/pgsty/pg_mooncake),
        [`pgsty/duckdb_mooncake`](https://github.com/pgsty/duckdb_mooncake), and [`pgsty/moonlink`](https://github.com/pgsty/moonlink)—for the PostgreSQL ecosystem.
    - question: What changed in PGSTY's pg_mooncake 0.3.0 release?
      answer: >-
        [**`pg_mooncake 0.3.0`**](/blog/release/pg-mooncake-0.3.0/) upgrades the Rust PostgreSQL extension to **`pgrx 0.19.3`**
        (supporting **PostgreSQL 14–18**), ports **`duckdb_mooncake` (`v0.0.2`)** to **`pg_duckdb 1.2.0`** and **DuckDB `v2.0.0`**
        (using exported multi-file Parquet statistics interfaces without object-cache lock reentrancy), fixes **`moonlink` (`v0.0.1`)**
        `create_snapshot(lsn)` hangs when unrelated tables advance database WAL, automatically sets `REPLICA IDENTITY FULL` on existing
        leaf partitions, and patches 20+ RustSec dependency advisories.
    - question: How does pg_mooncake v0.2 / v0.3 differ from v0.1?
      answer: >-
        In [`v0.1`](/docs/v0.1/), users wrote directly to `CREATE TABLE ... USING columnstore` tables backed by Delta Lake, which struggled
        with small frequent OLTP inserts and updates. Starting in `v0.2` and `v0.3.0`, `pg_mooncake` uses a **columnstore mirror** architecture
        powered by [`moonlink`](/docs/intro/moonlink/): your application continues writing to standard PostgreSQL heap tables (`INSERT`/`UPDATE`/`DELETE`),
        while `moonlink` streams changes via logical replication into in-memory Arrow buffers, Roaring deletion vectors, and Apache Iceberg v2 Parquet files.
        See [v0.1 vs v0.2 & v0.3](/docs/intro/0.1-vs-0.2/).
    - question: What licenses apply to pg_mooncake, duckdb_mooncake, and moonlink?
      answer: >-
        [`pg_mooncake`](https://github.com/pgsty/pg_mooncake) and [`duckdb_mooncake`](https://github.com/pgsty/duckdb_mooncake) (along with
        `moonlink_rpc`, `moonlink_proto`, `moonlink_error`, and `moonlink_table_metadata`) are licensed under the permissive **MIT License**.
        The core [`moonlink`](https://github.com/pgsty/moonlink) engine is licensed under **BSL-1.1** (converting automatically to **Apache-2.0**
        on May 5, 2029) with an explicit **`PG_MOONCAKE LINKING & DISTRIBUTION EXCEPTION`** that permits unrestricted linking, copying,
        modification, and redistribution when embedded in or distributed as part of `pg_mooncake`. See [License Details](/docs/about/license/).
    - question: Why did my mooncake.create_table call fail when passing source_uri?
      answer: >-
        Upstream v0.2 documentation contained a parameter typo (`source_uri => ...`). The actual SQL procedure signature in `pg_mooncake` is
        `mooncake.create_table(dst text, src text, src_uri text DEFAULT NULL, table_config json DEFAULT NULL)`. Always pass **`src_uri`**
        when replicating from a remote PostgreSQL URI. See [Create Columnstore Table](/docs/reference/create-columnstore/).
    - question: What is PGSTY's maintenance scope and security reporting policy?
      answer: >-
        PGSTY maintains supply-chain continuity, PostgreSQL 14–18 and `pg_duckdb` compatibility, and Linux RPM/DEB packaging across [16 OS/arch targets](/download/),
        with full dependency disclosures in the [SBOM](/docs/about/sbom/). We do **not** commit to developing new upstream features—roadmap items are
        handled on a best-effort basis—but **security vulnerabilities and critical bug reports are always welcome** via [GitHub Issues](https://github.com/pgsty/pg_mooncake/issues).


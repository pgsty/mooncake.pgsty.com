steps:
  eyebrow: 快速上手
  title: 三步运行 pg_mooncake
  desc: 通过 Pigsty 安装原生软件包，配置预加载扩展，即可创建你的第一张实时列存镜像表。
  items:
    - icon: fa-solid fa-download
      title: 安装扩展软件包
      desc: 使用 `pig` 包管理器在 16 个 Linux 发行版平台与 PostgreSQL 14–18 上一键安装 `pg_duckdb` 与 `pg_mooncake`。
      cmd:
        code: pig repo add pgsql -u && pig install pg_duckdb pg_mooncake
    - icon: fa-solid fa-plug
      title: 启用 pg_mooncake 扩展
      desc: 设置 `wal_level = logical` 与 `shared_preload_libraries = 'pg_duckdb,pg_mooncake'`，重启后创建扩展。
      cmd:
        code: psql -d postgres -c "CREATE EXTENSION IF NOT EXISTS pg_mooncake CASCADE;"
    - icon: fa-solid fa-table-columns
      title: 创建镜像并实时分析
      desc: 调用 `mooncake.create_table` 为业务行存表创建实时列存镜像，并直接执行向量化分析查询。
      cmd:
        code: psql -d postgres -c "CALL mooncake.create_table('orders_analytics', 'orders');"

faq:
  eyebrow: 常见问题
  title: 了解 Mooncake 扩展套件与 PGSTY 社区维护说明
  flat: true
  items:
    - question: 为什么由 PGSTY 社区维护 pg_mooncake、duckdb_mooncake 与 moonlink？
      answer: >-
        原开发团队 **Mooncake Labs Inc.** 被 Databricks 收购后，原官方文档站（`docs.mooncake.dev`）下线，上游开源仓库亦停止日常维护。
        **[PGSTY](https://pigsty.cc/)（Pigsty）** 社区从 Internet Archive Wayback Machine 完整找回并核验了全部 34 个历史文档页面，
        并正式维护三个核心开源仓库——[`pgsty/pg_mooncake`](https://github.com/pgsty/pg_mooncake)、[`pgsty/duckdb_mooncake`](https://github.com/pgsty/duckdb_mooncake)
        与 [`pgsty/moonlink`](https://github.com/pgsty/moonlink)——以保障 PostgreSQL 开源生态用户的持续可用性。
    - question: PGSTY 发布的 pg_mooncake 0.3.0 版本有哪些核心改进？
      answer: >-
        [**`pg_mooncake 0.3.0`**](/zh/blog/release/pg-mooncake-0.3.0/) 将 PostgreSQL 扩展升级至 **`pgrx 0.19.3`**（全面支持 **PostgreSQL 14–18**），
        将 **`duckdb_mooncake`（`v0.0.2`）** 适配至 **`pg_duckdb 1.2.0`** 与 **DuckDB `v2.0.0`**（改用导出的多文件 Parquet 统计信息接口并消除对象缓存互斥锁重入死锁），
        修复了 **`moonlink`（`v0.0.1`）** 在其他表推进数据库 WAL 时导致 `create_snapshot(lsn)` 挂起超时的问题，自动为现有分区叶子表设置 `REPLICA IDENTITY FULL`，
        并修复了 20 余项 RustSec 依赖安全公告。
    - question: pg_mooncake v0.2 / v0.3 与早期的 v0.1 架构有什么区别？
      answer: >-
        在早期的 [`v0.1`](/zh/docs/v0.1/) 中，用户直接向基于 Delta Lake 的 `CREATE TABLE ... USING columnstore` 表写入数据，不适合高频小事务 OLTP 写入与更新。
        从 `v0.2` 与 `v0.3.0` 起，`pg_mooncake` 采用由 [`moonlink`](/zh/docs/intro/moonlink/) 驱动的**实时列存镜像（Columnstore Mirror）**架构：
        业务应用继续向标准 PostgreSQL 行存表执行 `INSERT`、`UPDATE`、`DELETE`，而 `moonlink` 通过逻辑复制实时摄取变更并维护内存 Arrow 缓冲、Roaring 删除向量与 Apache Iceberg v2 Parquet 文件。
        详见 [v0.1 与 v0.2 / v0.3 架构演进对比](/zh/docs/intro/0.1-vs-0.2/)。
    - question: pg_mooncake、duckdb_mooncake 与 moonlink 分别采用什么开源许可证？
      answer: >-
        [`pg_mooncake`](https://github.com/pgsty/pg_mooncake) 与 [`duckdb_mooncake`](https://github.com/pgsty/duckdb_mooncake)（以及 `moonlink_rpc`、`moonlink_proto`、`moonlink_error`、`moonlink_table_metadata` 客户端库）
        均采用宽松的 **MIT 许可证**。核心摄取引擎 [`moonlink`](https://github.com/pgsty/moonlink) 采用 **BSL-1.1 许可证**（将于 2029 年 5 月 5 日自动转为 **Apache-2.0**），
        并附带明确的 **`PG_MOONCAKE LINKING & DISTRIBUTION EXCEPTION`（链接与分发豁免条款）**，允许在作为 `pg_mooncake` 一部分嵌入或分发时自由链接、修改与再分发。详见[许可证说明](/zh/docs/about/license/)。
    - question: 为什么按旧文档传入 source_uri 调用 mooncake.create_table 会报错？
      answer: >-
        上游 v0.2 历史文档中存在参数名笔误（写成了 `source_uri => ...`）。`pg_mooncake` 源码中的真实存储过程签名为
        `mooncake.create_table(dst text, src text, src_uri text DEFAULT NULL, table_config json DEFAULT NULL)`。当从远程 PostgreSQL URI 复制时，请务必使用 **`src_uri`** 参数。详见[创建列存表参考](/zh/docs/reference/create-columnstore/)。
    - question: PGSTY 社区的维护范围与安全漏洞反馈渠道是什么？
      answer: >-
        PGSTY 社区重点保障开源供应链连续性、PostgreSQL 14–18 与 `pg_duckdb` 兼容性，以及 [16 个 Linux 发行版与架构平台](/zh/download/)的原生软件包构建，
        并在 [SBOM 页面](/zh/docs/about/sbom/)完整披露依赖项与安全审计状态。我们**不承诺开发上游路线图中的新功能**（将视维护精力余量响应），
        但如果您发现任何**安全漏洞或严重缺陷**，欢迎随时通过 [GitHub Issues](https://github.com/pgsty/pg_mooncake/issues) 提交报告。


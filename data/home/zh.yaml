hero:
  eyebrow: pg_mooncake 0.3.0 · PostgreSQL 14–18 · DuckDB 2.0 与 Apache Iceberg v2
  title_lines:
    - 实时列存与湖仓引擎
    - 为 PostgreSQL 而生
  title_size: 3.6rem
  lead: >-
    基于 `moonlink` 逻辑复制 CDC、`pg_duckdb` 向量化执行引擎与开放 Apache Iceberg v2 存储格式，
    为 PostgreSQL 行存表提供亚秒级同步的实时列存镜像表。
  note: 'Fork 自 [Mooncake Labs](https://github.com/Mooncake-Labs/pg_mooncake) · 现由 [PGSTY](https://pigsty.cc/) 社区维护 · [MIT 与 BSL-1.1 链接豁免许可](/zh/docs/about/license/)'
  image:
    light: img/mooncake-architecture-light.svg
    dark: img/mooncake-architecture-dark.svg
    alt: >-
      Mooncake 架构图：PostgreSQL 行存表 WAL 日志实时流入 Moonlink 内存 Arrow 缓冲区与 Parquet 文件，
      由 pg_duckdb 与 duckdb_mooncake 执行向量化查询，或导出为 Apache Iceberg v2 湖仓表。
  media:
    ratio: 1.24fr 0.76fr
    max_width: 440px
    hide_below: lg
  actions:
    - label: 快速开始
      url: /docs/getting-started/
      icon: fa-solid fa-rocket
      style: primary
    - label: Hello World
      url: /docs/getting-started/hello-world/
      icon: fa-solid fa-terminal
      style: ghost
    - label: 架构总览
      url: /docs/intro/architecture/
      icon: fa-solid fa-sitemap
      style: ghost
  detail:
    label: 了解 pg_mooncake 0.3.0 新特性
    url: /blog/release/pg-mooncake-0.3.0/

metrics:

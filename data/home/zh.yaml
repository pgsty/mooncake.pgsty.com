  title: 无需外部 ETL 管道的数据库内列式分析
  desc: 将 PostgreSQL 事务写入能力与 DuckDB 2.0 向量化执行引擎、开放 Apache Iceberg v2 对象存储无缝融合。
  columns: 2
  items:
    - value: "1000× 提速"
      title: 向量化分析扫描
      label: 向量化分析扫描
      desc: 基于 DuckDB 2.0 扫描 Parquet 与内存 Arrow 缓冲区，大幅超越传统堆表扫描
      icon: fa-solid fa-bolt
      url: /docs/reference/query-columnstore/
    - value: "< 10 ms"
      title: 亚秒级 CDC 实时同步
      label: 亚秒级 CDC 实时同步
      desc: 通过 PostgreSQL 逻辑复制将 INSERT、UPDATE 与 DELETE 实时流入 Moonlink 缓冲区
      icon: fa-solid fa-arrows-rotate
      url: /docs/intro/moonlink/
    - value: "Iceberg v2"
      title: 开放湖仓表格式
      label: 开放湖仓表格式
      desc: 将快照导出至 S3、Cloudflare R2 或本地磁盘，供 Spark、Snowflake 与 PyIceberg 直接查询
      icon: fa-solid fa-cloud

capabilities:
  eyebrow: 核心引擎架构
  title: 行存承载事务写入，列存加速分析读取
  text: pg_mooncake 将内嵌式 Rust 实时摄取引擎（moonlink）与基于 pg_duckdb / duckdb_mooncake 的 DuckDB 2.0 向量化执行深度结合。
  items:
    - ref: 01 / PG_MOONCAKE · 实时列存镜像
      title: 一条命令为任意 Postgres 表创建列存镜像
      url: /docs/reference/create-columnstore/
      motto: 原生 USING mooncake 表访问方法 + 逻辑复制流
      bullets:
        - '为任意普通堆表或分区表创建基于 `USING mooncake` 的只读列存镜像表'
        - '保持现有 OLTP 业务写入路径 **100% 不变**，无需触发器或应用层双写'
        - '既可镜像当前数据库中的本地表，也可通过 `src_uri` 复制远程 PostgreSQL 实例'
      value: 让慢速聚合报表查询瞬间转化为亚秒级向量化扫描。
      visual:
        type: code
        aria_label: 在 PostgreSQL 中创建实时列存镜像表
        title: create_mirror.sql
        lines:
          - { class: c, prefix: '-- ', text: '启用 pg_mooncake（自动加载 pg_duckdb 1.2.0）' }
          - { class: k, prefix: '', text: 'CREATE EXTENSION IF NOT EXISTS pg_mooncake CASCADE;' }
          - { class: c, prefix: '-- ', text: '为 orders 行存表创建实时列存镜像' }
          - { class: k, prefix: '', text: 'CALL mooncake.create_table(''orders_analytics'', ''orders'');' }
          - { class: c, prefix: '-- ', text: '写入原行存表，从列存镜像表执行聚合分析' }
          - { class: k, prefix: '', text: 'INSERT INTO orders (customer_id, amount) VALUES (42, 199.95);' }
          - { class: k, prefix: '', text: 'SELECT customer_id, SUM(amount) FROM orders_analytics' }
          - { class: k, prefix: '  ', text: 'GROUP BY customer_id;' }
    - ref: 02 / MOONLINK · 实时 CDC 摄取引擎
      title: 高效处理更新删除与 LSN 事务一致性
      url: /docs/intro/moonlink/
      motto: 内嵌 PostgreSQL 后台工作进程与独立 HTTP/RPC 摄取服务
      bullets:
        - '最新写入在内存中缓冲为 **Apache Arrow** 列存批次，立即可查'
        - '通过 **Roaring Bitmap** 删除向量（Deletion Vectors）高效处理高频 `UPDATE` 与 `DELETE`'
        - '查询自动等待目标 WAL LSN 屏障，确保分析读取具备强事务一致性'
      value: 彻底解决传统 Parquet / Iceberg 实时写入产生海量小文件的顽疾。
      visual:
        type: code
        aria_label: 查看 Moonlink 复制 LSN 状态并生成快照
        title: moonlink_status.sql
        lines:
          - { class: c, prefix: '-- ', text: '查看所有活跃列存镜像表及其 WAL LSN 进度' }
          - { class: k, prefix: '', text: 'SELECT * FROM mooncake.list_tables();' }
          - { class: c, prefix: '-- ', text: '返回列: table, commit_lsn, flush_lsn, iceberg_warehouse_location' }
          - { class: c, prefix: '-- ', text: '将内存 Arrow 缓冲区刷盘并生成新的 Iceberg 快照' }
          - { class: k, prefix: '', text: 'CALL mooncake.create_snapshot(''orders_analytics'');' }
          - { class: c, prefix: '-- ', text: '合并 Parquet 文件并重写删除向量' }
          - { class: k, prefix: '', text: 'CALL mooncake.optimize_table(''orders_analytics'', ''full'');' }
    - ref: 03 / DUCKDB_MOONCAKE · 向量化扫描
      title: 基于 DuckDB 2.0 与 pg_duckdb 1.2 驱动
      url: /docs/intro/duckdb-mooncake/
      motto: 多文件 Parquet 统计信息剪枝 + 零拷贝 Arrow 融合扫描
      bullets:
        - '查询时无缝合并已刷盘的 **Parquet** 数据文件与内存中的 **Arrow** 实时缓冲'
        - '适配 DuckDB 2.0 多文件 Parquet 统计信息接口，实现高效文件段跳过（Segment Elimination）'
        - '支持列存镜像表与常规 PostgreSQL 行存表之间的直接混合 `JOIN`'
      value: 通过标准 PostgreSQL 连接直接获得 DuckDB 2.0 的极致分析性能。
      visual:
        type: code
        aria_label: PostgreSQL 行存表与 Mooncake 列存表混合关联查询
        title: hybrid_join.sql
        lines:
          - { class: c, prefix: '-- ', text: '直接关联 PostgreSQL 普通堆表与列存镜像表' }
          - { class: k, prefix: '', text: 'SELECT u.region, date_trunc(''day'', o.created_at) AS day,' }
          - { class: k, prefix: '       ', text: 'COUNT(*) AS orders, SUM(o.amount) AS revenue' }
          - { class: k, prefix: '', text: 'FROM users u' }
          - { class: k, prefix: '', text: 'JOIN orders_analytics o ON u.id = o.customer_id' }
          - { class: k, prefix: '', text: 'WHERE o.created_at >= NOW() - INTERVAL ''30 days''' }
          - { class: k, prefix: '', text: 'GROUP BY u.region, day ORDER BY day DESC;' }
    - ref: 04 / APACHE ICEBERG v2 · 零 ETL 湖仓一体
      title: 导出至 S3 / R2 并直接查询外部数据湖
      url: /docs/reference/iceberg/
      motto: 标准 Iceberg v2 元数据生成 + 外部 Parquet / Delta / Iceberg 直接扫描
      bullets:
        - '自动在本地磁盘、AWS S3 或 Cloudflare R2 上维护标准 **Apache Iceberg v2** 表元数据'
        - '在 PostgreSQL 内直接查询外部 Parquet、CSV、Iceberg、Delta Lake 与 HuggingFace 数据集'
        - '冷热分层归档模式：直接 `DROP` 旧行存分区释放磁盘，列存镜像完整保留全部历史数据'
      value: 无需维护繁重的外部数据管道，打通业务库与云端数据湖。
      visual:
        type: code
        aria_label: 配置 S3 对象存储桶并生成 Iceberg 快照
        title: iceberg_lakehouse.sql
        lines:
          - { class: c, prefix: '-- ', text: '配置 S3 / R2 凭据与默认存储桶路径' }
          - { class: k, prefix: '', text: 'INSERT INTO duckdb.secrets (name, type, key_id, secret, region, scope)' }
          - { class: v, prefix: '  ', text: 'VALUES (''s3_lake'', ''S3'', ''AKIA...'', ''secret...'', ''us-east-1'', ''s3://my-bucket'');' }
          - { class: k, prefix: '', text: 'SET mooncake.default_bucket = ''s3://my-bucket/warehouse'';' }
          - { class: c, prefix: '-- ', text: '在对象存储上物化生成最新 Iceberg v2 快照' }
          - { class: k, prefix: '', text: 'CALL mooncake.create_snapshot(''orders_analytics'');' }


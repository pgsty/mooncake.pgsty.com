  <g fill="#FDE047">
    <circle cx="212.00" cy="120.00" r="3.5"/>
    <circle cx="199.67" cy="166.00" r="3.5"/>
    <circle cx="166.00" cy="199.67" r="3.5"/>
    <circle cx="120.00" cy="212.00" r="3.5"/>
